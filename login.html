<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — CODEBA Porto de Ilhéus</title>
<link rel="stylesheet" href="css/styles.css?v=10">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('codeba_theme')||'light')}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="login-centered">
  <div class="login-card card">
    <img class="doc-logo" src="assets/logo-codeba.png" alt="CODEBA — Autoridade Portuária">
    <h2>Sistema de Operações</h2>
    <p class="subtitle">Porto de Ilhéus — acesso do técnico</p>
    <form id="formLogin">
      <label class="field">Email cadastrado
        <input type="email" name="email" autocomplete="username" placeholder="nome@codeba.gov.br" required>
      </label>
      <br>
      <label class="field">Senha
        <span class="pw-wrap">
          <input type="password" name="senha" id="inputSenha" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="btnPw">Mostrar</button>
        </span>
      </label>
      <div class="btn-row">
        <button type="submit" class="btn btn-primary" id="btnLogin" style="flex:1;justify-content:center">Entrar</button>
      </div>
    </form>
    <p class="subtitle" style="margin:12px 0 0">Sem acesso? Peça ao gestor para criar seu usuário.<br><button type="button" class="link like-btn" id="btnEsqueci">Esqueci a senha</button></p>
    <div id="recBox" style="display:none;text-align:left;margin-top:12px">
      <label class="field">Email cadastrado
        <input type="email" id="recEmail" placeholder="nome@codeba.gov.br">
      </label>
      <div class="btn-row">
        <button type="button" class="btn btn-ghost" id="btnRec" style="flex:1;justify-content:center">Enviar link</button>
      </div>
    </div>
  </div>
  <p class="login-foot">CODEBA · Gerência do Porto de Ilhéus — uso interno</p>
</div>

<script src="js/config.js?v=4"></script>
<script src="js/theme.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script src="js/db.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
<script>
function friendlyError(err) {
  const msg = String((err && err.message) || err || '');
  if (/invalid login credentials/i.test(msg))
    return 'Email ou senha incorretos. Confira o email completo cadastrado (ex.: nome@codeba.gov.br) e tente de novo.';
  if (/email not confirmed/i.test(msg))
    return 'Email ainda não confirmado. Peça ao gestor para confirmar seu usuário no painel do Supabase.';
  if (/failed to fetch|networkerror|load failed/i.test(msg))
    return 'Sem conexão com o servidor. Verifique a internet e tente de novo.';
  return 'Não foi possível entrar: ' + msg;
}

(async function () {
  const sb = DB.getClient();
  if (!sb) {
    toast('Falha de conexão. Recarregue a página.', 'err');
    return;
  }
  const { data } = await sb.auth.getSession();
  const next = new URLSearchParams(location.search).get('next') || 'index.html';
  if (data?.session) { location.replace(next); return; }
  if (new URLSearchParams(location.search).get('motivo') === 'desativado') {
    toast('Acesso desativado. Fale com o gestor.', 'err');
  }

  const pw = document.getElementById('inputSenha');
  document.getElementById('btnPw').onclick = () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    document.getElementById('btnPw').textContent = show ? 'Ocultar' : 'Mostrar';
  };

  document.getElementById('btnEsqueci').onclick = () => {
    const box = document.getElementById('recBox');
    box.style.display = box.style.display === 'none' ? '' : 'none';
    const em = document.querySelector('#formLogin [name="email"]').value;
    if (em) document.getElementById('recEmail').value = em;
  };
  document.getElementById('btnRec').onclick = async () => {
    const email = document.getElementById('recEmail').value.trim().toLowerCase();
    if (!email) { toast('Informe o email cadastrado.', 'err'); return; }
    try {
      const redirectTo = location.href.split('login.html')[0] + 'redefinir.html';
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      toast('Link enviado. Confira seu email (inclusive spam).', 'ok');
    } catch (err) { toast(friendlyError(err), 'err'); }
  };

  document.getElementById('formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const fd = new FormData(e.target);
    try {
      const { error } = await sb.auth.signInWithPassword({
        email: String(fd.get('email')).trim().toLowerCase(),
        password: String(fd.get('senha'))
      });
      if (error) throw error;
      let dest = next;
      try {
        await Auth.ensureProfile();
        const p = await Auth.profile();
        if (p && p.ativo === false) {
          await sb.auth.signOut();
          toast('Acesso desativado. Fale com o gestor.', 'err');
          return;
        }
        if (!p?.funcao) dest = 'perfil.html?novo=1&next=' + encodeURIComponent(next);
      } catch (_) {}
      location.replace(dest);
    } catch (err) {
      toast(friendlyError(err), 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
})();
</script>
</body>
</html>
