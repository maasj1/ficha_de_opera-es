<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — CODEBA Porto de Ilhéus</title>
<link rel="stylesheet" href="css/styles.css">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('codeba_theme')||'light')}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
  <div class="login-wrap">
    <div class="card" style="text-align:center">
      <img class="doc-logo" src="assets/logo-codeba.png" alt="CODEBA — Autoridade Portuária"><br>
      <h2 style="margin:8px 0 4px">Sistema de Operações</h2>
      <p class="subtitle">Porto de Ilhéus — acesso do técnico</p>
      <form id="formLogin" style="text-align:left">
        <label class="field">Email <input type="email" name="email" autocomplete="username" required></label>
        <br>
        <label class="field">Senha <input type="password" name="senha" autocomplete="current-password" required></label>
        <div class="btn-row">
          <button type="submit" class="btn btn-primary" id="btnLogin" style="flex:1;justify-content:center">Entrar</button>
        </div>
      </form>
      <p class="subtitle" style="margin:12px 0 0">Sem acesso? Peça ao gestor para criar seu usuário.</p>
    </div>
    <div class="footer">CODEBA · Gerência do Porto de Ilhéus — uso interno</div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/theme.js"></script>
<script src="js/ui.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script>
(async function () {
  const sb = DB.getClient();
  if (!sb) {
    toast('Falha de conexão. Recarregue a página.', 'err');
    return;
  }
  const { data } = await sb.auth.getSession();
  const next = new URLSearchParams(location.search).get('next') || 'index.html';
  if (data?.session) { location.replace(next); return; }

  document.getElementById('formLogin').onsubmit = async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnLogin');
    btn.disabled = true; btn.textContent = 'Entrando...';
    const fd = new FormData(e.target);
    try {
      const { error } = await sb.auth.signInWithPassword({
        email: String(fd.get('email')).trim(),
        password: String(fd.get('senha'))
      });
      if (error) throw error;
      location.replace(next);
    } catch (err) {
      toast('Não foi possível entrar: ' + err.message, 'err');
    } finally {
      btn.disabled = false; btn.textContent = 'Entrar';
    }
  };
})();
</script>
</body>
</html>
